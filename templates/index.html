<!DOCTYPE html>
<html lang="dv"> <!-- Setting lang to dv for Dhivehi -->
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dhivehi Reference Generator</title>
    <style>
        body { font-family: Arial, sans-serif; direction: rtl; margin: 20px; } /* RTL for Dhivehi */
        .container { width: 500px; margin: auto; padding: 20px; border: 1px solid #ccc; border-radius: 8px; }
        label { display: block; margin-top: 10px; }
        input[type="text"], input[type="number"], input[type="url"] { width: 95%; padding: 8px; margin-top: 5px; border: 1px solid #ddd; border-radius: 4px; }
        input[type="submit"] { margin-top: 20px; padding: 10px 20px; background-color: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; }
        .reference-output { margin-top: 20px; padding: 10px; background-color: #f9f9f9; border: 1px solid #eee; border-radius: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Dhivehi Reference Generator</h1>
        <form action="/generate" method="post">
            <label for="author">Author (ޖުބޭޔާ އަހަމަދު):</label>
            <input type="text" id="author" name="author" required>

            <label for="year">Year (2025):</label>
            <input type="number" id="year" name="year" required>

            <label for="month">Month (ޖޫން):</label>
            <input type="text" id="month" name="month" required>

            <label for="day">Day (7):</label>
            <input type="number" id="day" name="day" required>

            <label for="title">Title (އިސްލާމް ފޯބިޑްސް އެކްސްޓްރާވެގެންސް، ވޭސްޓް):</label>
            <input type="text" id="title" name="title" required>

            <label for="url">URL:</label>
            <input type="url" id="url" name="url" required>

            <input type="submit" value="Generate Reference">
        </form>

        {% if reference %}
        <div class="reference-output">
            <h2>Generated Reference:</h2>
            <p>{{ reference }}</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
